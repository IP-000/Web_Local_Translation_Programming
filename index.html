<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ウェブローカル翻訳</title>
    <link rel="stylesheet" href="index.css">
    <script type="text/javascript" src="index.js" defer></script>
</head>

<body>
    <div class="main">
        <div id="title_text">ウェブローカルプログラミング翻訳</div>
        <form id="setlang_radio">
            <label><input type="radio" name="set_lang" value="C">C</label>
            <label><input type="radio" name="set_lang" value="C++">C++</label>
            <label><input type="radio" name="set_lang" value="C#">C#</label>
            <label><input type="radio" name="set_lang" value="Python">Python</label>
            <label><input type="radio" name="set_lang" value="Rust">Rust</label>
            <label><input type="radio" name="set_lang" value="Java">Java</label>
            <label><input type="radio" name="set_lang" value="HTML/CSS">HTML/CSS</label>
            <label><input type="radio" name="set_lang" value="JavaScript">JavaScript</label>
            <label><input type="radio" name="set_lang" value="GDscript">GDscript</label>
        </form>
        <textarea id="text_input" rows="0" cols="0"></textarea>
        <textarea id="text_output" rows="0" cols="0" readonly></textarea>
        <form id="setsize_radio">
            <label><input type="radio" name="set_size" value="mini">mini</label>
            <label><input type="radio" name="set_size" value="def" checked>default</label>
        </form>
        <header id="main_header">2026 IP-000© <a href="disclaimer.html">免責事項</a></header>
    </div>

</body>

</html>
